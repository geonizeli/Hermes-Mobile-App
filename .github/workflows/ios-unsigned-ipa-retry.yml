# Re-run Build unsigned iOS IPA when GitHub never assigns a macOS runner (capacity).
# Real failures always execute at least one step; runner starvation leaves steps empty.
name: Retry unsigned iOS IPA (runner capacity)

on:
  workflow_run:
    workflows: [Build unsigned iOS IPA]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  maybe-rerun:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'cancelled'
    steps:
      - name: Re-run when no hosted macOS runner was acquired
        uses: actions/github-script@v7
        with:
          script: |
            const NOT_ACQUIRED = 'not acquired by Runner';
            const run = context.payload.workflow_run;
            const maxAttempts = 5;
            if (run.run_attempt >= maxAttempts) {
              core.warning(
                `Build unsigned iOS IPA attempt ${run.run_attempt}/${maxAttempts} ended without a successful build; stopping automatic retries. Re-run manually from Actions when macOS capacity improves.`,
              );
              return;
            }

            const { data: jobsResponse } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
            });
            const jobs = jobsResponse.jobs;
            const starved = jobs.filter(
              (job) =>
                job.steps.length === 0 &&
                (job.conclusion === 'failure' ||
                  job.conclusion === 'cancelled'),
            );
            if (starved.length === 0) {
              core.info('Jobs ran at least one step; treating this as a real failure (no auto-retry).');
              return;
            }

            let shouldRetry = false;
            for (const job of starved) {
              const { data: annotations } = await github.request(
                'GET /repos/{owner}/{repo}/check-runs/{check_run_id}/annotations',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  check_run_id: job.id,
                },
              );
              if (
                annotations.some(
                  (a) => a.message && a.message.includes(NOT_ACQUIRED),
                )
              ) {
                shouldRetry = true;
                break;
              }
            }
            if (!shouldRetry) {
              core.info(
                'Zero-step jobs were cancelled for another reason (for example concurrency); skipping auto-retry.',
              );
              return;
            }

            core.notice(
              `macOS hosted runner was not acquired for run ${run.id}; scheduling attempt ${run.run_attempt + 1} of ${maxAttempts}.`,
            );
            await github.rest.actions.reRunWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
            });